<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>SitebarXL ScrollAd</title>
	<meta name="ad.size" content="width=1000,height=1000">
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<script type="text/javascript">
	</script>
	<style>
		html, body {
			overflow: hidden;
			background: transparent;
			width:100%;
			height:100%;
			max-width: 1000px;
			max-height: 1000px;
		}
		body {
			transition: opacity 0.05s;
		}
		#animation_container {
			cursor: pointer;
			position:absolute;
			top:0px;
			min-width: 600px !important;
			min-height: 600px !important;
		}
	</style>
	<script src="createjs_2019.11.15_min.js"></script>
	<script src="index.js"></script>
	<script>
		var canvas, stage, exportRoot, anim_container, dom_overlay_container, fnStartAnimation;
		var reverse = false;
		function init() {
			canvas = document.getElementById("canvas");
			anim_container = document.getElementById("animation_container");
			dom_overlay_container = document.getElementById("dom_overlay_container");
			var comp=AdobeAn.getComposition(Object.keys(AdobeAn.compositions)[0]);
			var lib=comp.getLibrary();
			var loader = new createjs.LoadQueue(false);
			loader.addEventListener("fileload", function(evt){handleFileLoad(evt,comp)});
			loader.addEventListener("complete", function(evt){handleComplete(evt,comp)});
			var lib=comp.getLibrary();
			if (lib.properties.manifest.length < 1) { handleComplete({}, comp);
		} else { 
			var loader = new createjs.LoadQueue(false);
			loader.addEventListener("fileload", function(evt) { handleFileLoad(evt, comp) });
			loader.addEventListener("complete", function(evt) { handleComplete(evt, comp) });
			var lib = comp.getLibrary(); loader.loadManifest(lib.properties.manifest); }
		}
		function handleFileLoad(evt, comp) {
			var images=comp.getImages();	
			if (evt && (evt.item.type == "image")) { images[evt.item.id] = evt.result; }	
		}
		function handleComplete(evt,comp) {
			var lib=comp.getLibrary();
			var ss=comp.getSpriteSheet();
			var queue = evt.target;
			var ssMetadata = lib.ssMetadata;
			for(i=0; i<ssMetadata.length; i++) {
				ss[ssMetadata[i].name] = new createjs.SpriteSheet( {"images": [queue.getResult(ssMetadata[i].name)], "frames": ssMetadata[i].frames} )
			}
			exportRoot = new lib.index();
			

// COMMENT
// ELEMENT POSITIONING - Init
			window.positionedElements = [];

// Add elements to queue here
			//adjustElementPosition(exportRoot.close, "left");
			//adjustElementPosition(exportRoot.close, "right");

// ELEMENT POSITIONING - Apply
			adjustElementPosition(null, null);

			stage = new lib.Stage(canvas);
			stage.enableMouseOver();	
			fnStartAnimation = function() {
				stage.addChild(exportRoot);
				createjs.Ticker.setFPS(lib.properties.fps);
				createjs.Ticker.addEventListener("tick", stage);
			}	    
			function makeResponsive(isResp, respDim, isScale, scaleType) {		
				var lastW, lastH, lastS=1;		
				window.addEventListener('resize', resizeCanvas);		
				resizeCanvas();		
				function resizeCanvas() {
					var iw = window.innerWidth;
					if (iw < 300) { iw = 300; }
					var w = lib.properties.width, h = lib.properties.height;
					var ih = window.innerHeight;
					var pRatio = window.devicePixelRatio || 1, xRatio = iw / w, yRatio = ih / h, sRatio = 1;

					if (isResp) {
						if ((respDim == 'width' && lastW == iw) || (respDim == 'height' && lastH == ih)) { sRatio = lastS; }
						else if (!isScale) { if (iw < w || ih < h) sRatio = Math.min(xRatio, yRatio); }
						else if (scaleType == 1) { sRatio = Math.min(xRatio, yRatio); }
						else if (scaleType == 2) { sRatio = Math.max(xRatio, yRatio); }
					}

					canvas.width = w * pRatio * sRatio;
					canvas.height = h * pRatio * sRatio;
					canvas.style.width = dom_overlay_container.style.width = anim_container.style.width = w * sRatio + 'px';
					canvas.style.height = anim_container.style.height = dom_overlay_container.style.height = h * sRatio + 'px';
					stage.scaleX = pRatio * sRatio;
					stage.scaleY = pRatio * sRatio;
					lastW = iw; lastH = ih; lastS = sRatio;
					canvas.style.width = dom_overlay_container.style.width = anim_container.style.width = (ih * (canvas.height / canvas.width)) + 'px';
					canvas.style.height = anim_container.style.height = dom_overlay_container.style.height = ih + 'px';

					if (iw < ih) {
						anim_container.style.left = ((iw - ih) / 2) + "px";
						window.widthOffsetPerc = (1 - (document.body.offsetWidth / document.body.offsetHeight)) * -1;
						if (iw < (ih / 2)) {
							window.widthOffsetPerc = -0.5;
							canvas.style.width = dom_overlay_container.style.width = anim_container.style.width = (iw * 2) + 'px';
							canvas.style.height = anim_container.style.height = dom_overlay_container.style.height = (iw * 2) + 'px';
							anim_container.style.left = ((iw / 2) * -1) + "px";
						}
					} else {
						anim_container.style.left = "0px";
						window.widthOffsetPerc = 0;
					}
					stage.tickOnUpdate = false;
					stage.update();
					stage.tickOnUpdate = true;
					adjustElementPosition(null, null);
				}
				adjustElementPosition(null, null);
			}
			makeResponsive(false,'both',false,1);	
			AdobeAn.compositionLoaded(lib.properties.id);
			fnStartAnimation();
			if (dummy == true) { scrolling(); }
			document.getElementsByTagName('canvas')[0].addEventListener("mousedown", function(e) { if(e.button == 2) window.contextMenu = true; }, false);
		}

		function adjustElementPosition(targetElement, alignment) {
			const referenceWidth = 1000;
			const viewportRatio = window.innerWidth / window.innerHeight;
			if (targetElement !== null) {
				window.positionedElements = window.positionedElements || [];
				window.positionedElements.push({ obj: targetElement, x: targetElement.x, y: targetElement.y, align: alignment });
			} else {
				const elements = window.positionedElements || [];
				for (let i = 0; i < elements.length; i++) {
					const element = elements[i];
					const elementWidth = element.obj.offsetWidth;
					if (window.innerWidth >= elementWidth) { element.obj.x = element.x; }
					else if (window.innerWidth <= (elementWidth / 2)) {
						const quarterWidth = referenceWidth / 4;
						if (element.align === "right") element.obj.x = element.x - quarterWidth;
						if (element.align === "left")  element.obj.x = element.x + quarterWidth;
					} else {
						const xOffset = (referenceWidth - referenceWidth * viewportRatio) / 2;
						if (element.align === "right") {
							element.obj.x = Math.max(732.65, Math.min(982.65, element.x - xOffset));
						}
						if (element.align === "left") {
							element.obj.x = Math.max(77.4, Math.min(313, element.x + xOffset));
						}
					}
				}
			}
		}
		var timeline;
	</script>
</head>
<body id="adBody" onload="init();" style="margin:0px;opacity:1;">
	<div id="animation_container" style="background-color:transparent; width:1000px; height:1000px; min-width: 600px !important; min-height: 600px !important;">
		<canvas id="canvas" width="1000" height="1000" style="position: absolute; display: block; background-color:transparent;"></canvas>
		<div id="dom_overlay_container" style="pointer-events:none; overflow:hidden; width:1000px; height:1000px; position: absolute; left: 0px; top: 0px; display: block;"></div>
		<!-- KEIN HTML-FALLBACK-BTN MEHR NÖTIG: Der Magic-BTN ist als CreateJS-MovieClip 
		     (exportRoot.magicClicktag) in der index.js perfekt positioniert (x=618, y=903.5) 
		     und feuert via pressup -> manageClicktags() -> magicClicktag() -->
	</div>

	<script type="text/javascript">
		// ============================================================
		// A) GLOBALS – zwingend für die index.js Frame-Actions
		//    (frame_0 'interacted'-Guard, frame_52..114 'magic'-Guard,
		//     handleComplete dummy-Branch 'scrolling')
		// ============================================================
		var scrollY = 0, windowHeight = 0, maxY = 0, totalFrames = 0;
		var interactive_screen = false;
		var dummy = false;            // true = lokales Testen OHNE initMessaging
		var scrolled  = false;
		var animated  = false;
		var interacted = false;
		var magic      = false;
		function scrolling() { /* Noop – Prod-Scroll läuft via mutScrollPosition unten */ }

		// ============================================================
		// B) CTA-CONTRACT ZUM OVERLAY
		//    'fly' = Original-Pokale-Wert. MUSS dem String im Overlay-Script entsprechen.
		// ============================================================
		var CTA_ACTION = 'fly';
		var CTA_DIRECTION = 'ltr';
		var CTA_SHOW_AFTER_PX = 500;   // Sitebar-Einblendung ab 500 px Scroll

		// ============================================================
		// C) PING-PONG-SCROLL (initMessaging-kompatibel)
		//    - lauscht NUR auf mutScrollPosition (Filter gegen Müll)
		//    - liest 'position' (NICHT 'scrollY')
		//    - keine Prozent-Normalisierung, keine docHeight/windowHeight-Rechnung
		//    - Richtung aus Delta ableitbar
		// ============================================================
		var lastScrollY = 0;
		var scrollDirection = "idle";
		var pingPongTickerActive = false;
		var scrollStopTimeout = null;

		function sendPm() {
			window.top.postMessage({
				name: "mutInit",
				origin: "sitebar",
				payload: { mutScrollPosition: true, mutState: true }
			}, "*");
		}
		var fallbackTimer = setTimeout(sendPm, 1000);

		window.addEventListener("message", function (e) {
			var d = e.data;
			if (!d || !d.name) return;

			if (d.name === "mutInitReady") { clearTimeout(fallbackTimer); sendPm(); return; }

			if (d.name !== "mutScrollPosition") return;
			var currentY = d.position;
			if (currentY == null || isNaN(currentY)) return;

			// Einblendung ab 500 px
			var animContainer = document.getElementById("animation_container");
			if (animContainer) {
				animContainer.style.opacity = currentY >= CTA_SHOW_AFTER_PX ? "1" : "0";
			}

			if (typeof exportRoot === "undefined" || !exportRoot.timeline) { lastScrollY = currentY; return; }

			// Richtung
			if (currentY > lastScrollY + 1)      { scrollDirection = "down"; startTimelinePlayback(); }
			else if (currentY < lastScrollY - 1) { scrollDirection = "up";   startTimelinePlayback(); }
			lastScrollY = currentY;

			// Pause bei Scroll-Stopp (100 ms)
			clearTimeout(scrollStopTimeout);
			scrollStopTimeout = setTimeout(stopPlayback, 100);
		}, false);
		sendPm();

		function startTimelinePlayback() {
			if (pingPongTickerActive) return;
			pingPongTickerActive = true;
			exportRoot.stop();
			createjs.Ticker.addEventListener("tick", handleTimelineTick);
		}
		function handleTimelineTick() {
			if (!exportRoot || !exportRoot.timeline) return;
			var cur = exportRoot.currentFrame;
			var total = exportRoot.timeline.duration - 1;
			if (scrollDirection === "down") {
				if (cur < total) exportRoot.gotoAndStop(cur + 1);
				else { exportRoot.gotoAndStop(total); stopPlayback(); }
			} else if (scrollDirection === "up") {
				if (cur > 0) exportRoot.gotoAndStop(cur - 1);
				else { exportRoot.gotoAndStop(0); stopPlayback(); }
			} else { stopPlayback(); }
			if (stage) stage.update();
		}
		function stopPlayback() {
			pingPongTickerActive = false;
			createjs.Ticker.removeEventListener("tick", handleTimelineTick);
			scrollDirection = "idle";
			if (exportRoot) exportRoot.stop();
		}

		// ============================================================
		// D) MAGIC CLICKTAG – wird von der index.js (frame_0/manageClicktags)
		//    aufgerufen, wenn der User auf den CreateJS-MovieClip klickt.
		//    Sendet NUR die mutForward-Message ans Overlay – die Pokale-Logik
		//    liegt dort, nicht hier.
		// ============================================================
		function magicClicktag() {
			console.log("Magic Clicktag! action=" + CTA_ACTION);
			window.top.postMessage({
				name: 'mutForward',
				origin: 'sitebar',
				payload: { target: 'game', action: CTA_ACTION, direction: CTA_DIRECTION }
			}, '*');
		}

		// ============================================================
		// E) URI-PARAMS (für den vollflächigen clicktag-Click in index.js)
		// ============================================================
		var getUriParams = (function () {
			var qs = {}, q = window.location.search.substring(1), a = q.split('&');
			for (var i = 0; i < a.length; i++) {
				var p = a[i].split('=');
				if (p[0]) qs[p[0]] = decodeURIComponent(p[1] || "");
			}
			return qs;
		})();

		// ============================================================
		// F) Safety-Net: 4 s ohne Scroll → Auto-Play
		// ============================================================
		setTimeout(function () {
			if (!scrolled && typeof exportRoot !== "undefined") {
				exportRoot.play();
				scrolled = true;
				animated = true;
			}
		}, 4000);

		// ============================================================
		// G) DUMMY-MODUS – lokales Testen OHNE initMessaging
		// ============================================================
		if (dummy === true) {
			console.log("Test Scrolling (Dummy Mode)");
			window.parent.addEventListener("scroll", function () {
				var pos = window.parent.scrollY || window.parent.pageYOffset;
				var animContainer = document.getElementById("animation_container");
				if (animContainer) animContainer.style.opacity = pos >= CTA_SHOW_AFTER_PX ? "1" : "0";
				if (typeof exportRoot === "undefined" || !exportRoot.timeline) { lastScrollY = pos; return; }
				if (pos > lastScrollY + 1)      { scrollDirection = "down"; startTimelinePlayback(); }
				else if (pos < lastScrollY - 1) { scrollDirection = "up";   startTimelinePlayback(); }
				lastScrollY = pos;
				clearTimeout(scrollStopTimeout);
				scrollStopTimeout = setTimeout(stopPlayback, 100);
			});
		}
	</script>
</body>
</html>
