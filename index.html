<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>SitebarXL ScrollAd</title>
	<meta name="ad.size" content="width=1000,height=1000">
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<script type="text/javascript">
	</script>
	<style>
		html, body {
			overflow: hidden;
			background: transparent;
			width:100%;
			height:100%;
			max-width: 1000px;
			max-height: 1000px;
		}
		body {
			transition: opacity 0.05s;
		}
		#animation_container {
			cursor: pointer; /* GDN */
			position:absolute;
			top:0px;
			min-width: 600px !important;
			min-height: 600px !important;
		}
	</style>
	<script src="createjs_2019.11.15_min.js"></script>
	<script src="index.js"></script>
	<script>
		var canvas, stage, exportRoot, anim_container, dom_overlay_container, fnStartAnimation;
		var reverse = false;
		function init() {
			canvas = document.getElementById("canvas");
			anim_container = document.getElementById("animation_container");
			dom_overlay_container = document.getElementById("dom_overlay_container");
			var comp=AdobeAn.getComposition(Object.keys(AdobeAn.compositions)[0]);
			var lib=comp.getLibrary();
			var loader = new createjs.LoadQueue(false);
			loader.addEventListener("fileload", function(evt){handleFileLoad(evt,comp)});
			loader.addEventListener("complete", function(evt){handleComplete(evt,comp)});
			var lib=comp.getLibrary();
			if (lib.properties.manifest.length < 1) { handleComplete({}, comp);
		} else { 
			var loader = new createjs.LoadQueue(false);
			loader.addEventListener("fileload", function(evt) { handleFileLoad(evt, comp) });
			loader.addEventListener("complete", function(evt) { handleComplete(evt, comp) });
			var lib = comp.getLibrary(); loader.loadManifest(lib.properties.manifest); }
		}
		function handleFileLoad(evt, comp) {
			var images=comp.getImages();	
			if (evt && (evt.item.type == "image")) { images[evt.item.id] = evt.result; }	
		}
		function handleComplete(evt,comp) {
			var lib=comp.getLibrary();
			var ss=comp.getSpriteSheet();
			var queue = evt.target;
			var ssMetadata = lib.ssMetadata;
			for(i=0; i<ssMetadata.length; i++) {
				ss[ssMetadata[i].name] = new createjs.SpriteSheet( {"images": [queue.getResult(ssMetadata[i].name)], "frames": ssMetadata[i].frames} )
			}
			exportRoot = new lib.index();
			

// COMMENT
// ELEMENT POSITIONING - Init
			window.positionedElements = [];

// Add elements to queue here
			//adjustElementPosition(exportRoot.close, "left");
			//adjustElementPosition(exportRoot.close, "right");

// ELEMENT POSITIONING - Apply
			adjustElementPosition(null, null);

			stage = new lib.Stage(canvas);
			stage.enableMouseOver();	
			fnStartAnimation = function() {
				stage.addChild(exportRoot);
				createjs.Ticker.setFPS(lib.properties.fps);
				createjs.Ticker.addEventListener("tick", stage);
			}	    
			function makeResponsive(isResp, respDim, isScale, scaleType) {		
				var lastW, lastH, lastS=1;		
				window.addEventListener('resize', resizeCanvas);		
				resizeCanvas();		
				function resizeCanvas() {
					var iw = window.innerWidth;

    // Add a condition to check if iw is less than 300px
					if (iw < 300) {
						iw = 300;
        //return; // Exit the function and do nothing
					}

					var w = lib.properties.width, h = lib.properties.height;
					var ih = window.innerHeight;
					var pRatio = window.devicePixelRatio || 1, xRatio = iw / w, yRatio = ih / h, sRatio = 1;

					if (isResp) {
						if ((respDim == 'width' && lastW == iw) || (respDim == 'height' && lastH == ih)) {
							sRatio = lastS;
						} else if (!isScale) {
							if (iw < w || ih < h)
								sRatio = Math.min(xRatio, yRatio);
						} else if (scaleType == 1) {
							sRatio = Math.min(xRatio, yRatio);
						} else if (scaleType == 2) {
							sRatio = Math.max(xRatio, yRatio);
						}
					}

					canvas.width = w * pRatio * sRatio;
					canvas.height = h * pRatio * sRatio;
					canvas.style.width = dom_overlay_container.style.width = anim_container.style.width = w * sRatio + 'px';
					canvas.style.height = anim_container.style.height = dom_overlay_container.style.height = h * sRatio + 'px';
					stage.scaleX = pRatio * sRatio;
					stage.scaleY = pRatio * sRatio;
					lastW = iw;
					lastH = ih;
					lastS = sRatio;
					canvas.style.width = dom_overlay_container.style.width = anim_container.style.width = (ih * (canvas.height / canvas.width)) + 'px';
					canvas.style.height = anim_container.style.height = dom_overlay_container.style.height = ih + 'px';

					if (iw < ih) {
						anim_container.style.left = ((iw - ih) / 2) + "px";
						window.widthOffsetPerc = (1 - (document.body.offsetWidth / document.body.offsetHeight)) * -1;
						if (iw < (ih / 2)) {
							window.widthOffsetPerc = -0.5;
							canvas.style.width = dom_overlay_container.style.width = anim_container.style.width = (iw * 2) + 'px';
							canvas.style.height = anim_container.style.height = dom_overlay_container.style.height = (iw * 2) + 'px';
							anim_container.style.left = ((iw / 2) * -1) + "px";
						}
					} else {
						anim_container.style.left = "0px";
						window.widthOffsetPerc = 0;
					}
					stage.tickOnUpdate = false;
					stage.update();
					stage.tickOnUpdate = true;
					adjustElementPosition(null, null);
				}

				//CALL THE FUNCTION TO ADJUST THE ELEMENTS OUTSIDE OF THE SAFE AREA
				adjustElementPosition(null, null);
				
			}
			makeResponsive(false,'both',false,1);	
			AdobeAn.compositionLoaded(lib.properties.id);
			fnStartAnimation();
			if (dummy == true) {
				scrolling();
			}
			document.getElementsByTagName('canvas')[0].addEventListener("mousedown", function(e) { if(e.button == 2) window.contextMenu = true; }, false);
		}

		//FUNCTION TO ADJUST THE ELEMENTS OUTSIDE OF THE SAFE AREA
		function adjustElementPosition(targetElement, alignment) {
			const referenceWidth = 1000;
			const viewportRatio = window.innerWidth / window.innerHeight;

			if (targetElement !== null) {
				// Store element information
				window.positionedElements = window.positionedElements || [];
				const elementInfo = {
					obj: targetElement,
					x: targetElement.x,
					y: targetElement.y,
					align: alignment
				};
				window.positionedElements.push(elementInfo);
			} else {
				// Reposition the elements
				const elements = window.positionedElements || [];

				for (let i = 0; i < elements.length; i++) {
					const element = elements[i];
					const elementWidth = element.obj.offsetWidth;
					const isHalfCanvasWidth = window.innerWidth <= (elementWidth / 2);
					const isFullCanvasWidth = window.innerWidth >= elementWidth;

					if (isFullCanvasWidth) {
						element.obj.x = element.x;
					} else if (isHalfCanvasWidth) {
						const quarterWidth = referenceWidth / 4;
						if (element.align === "right") {
							element.obj.x = element.x - quarterWidth;
						}
						if (element.align === "left") {
							element.obj.x = element.x + quarterWidth;
						}
					} else {
						const xOffset = (referenceWidth - referenceWidth * viewportRatio) / 2;
						if (element.align === "right") {
							console.log(element.x - xOffset);
							if ( (element.x - xOffset) >= 732.65 ) {
								element.obj.x = element.x - xOffset;
							} else {
								element.obj.x = 732.65;
							}
							if ((element.x - xOffset) > 982.65) {
								element.obj.x = 982.65;
							}
							console.log(element.obj.x);
						}
						if (element.align === "left") {
							if ( (element.x + xOffset) <= 313 ) {
								element.obj.x = element.x + xOffset;
							} else {
								element.obj.x = 313;
							}
							if ((element.x + xOffset) < 77.4) {
								element.obj.x = 77.4;
							}
						}
					}
				}
			}
		}
		var timeline;
	</script>
</head>
<body id="adBody" onload="init();" style="margin:0px;opacity:1;">
	<div id="animation_container" style="background-color:transparent; width:1000px; height:1000px; min-width: 600px !important; min-height: 600px !important;">
		<canvas id="canvas" width="1000" height="1000" style="position: absolute; display: block; background-color:transparent;"></canvas>
		<div id="dom_overlay_container" style="pointer-events:none; overflow:hidden; width:1000px; height:1000px; position: absolute; left: 0px; top: 0px; display: block;">
		</div>
	</div>

	<!-- ==================================================================
         UNTERER TEIL: NUR HIER habe ich geändert.
         Die zwei Original-Script-Blöcke der Designerin (400px-/Prozent-
         Scrubbing + adBody-Opacity) werden durch UNSER Ping-Pong + den
         initMessaging-kompatiblen Listener ersetzt.
         Layout-Code oben (head/style/init/resizeCanvas/adjustElementPosition)
         ist bit-identisch zur Designerin-Datei.
         ================================================================== -->
	<script type="text/javascript">
		// ------------------------------------------------------------
		// A) Globals, die index.js zwingend braucht
		//    (frame_0 'interacted', frame_52..114 'magic',
		//     handleComplete ruft scrolling() nur bei dummy=true)
		// ------------------------------------------------------------
		var scrollY, windowHeight, maxY, totalFrames;
		var interactive_screen = false;
		var dummy = false;            // true = lokal OHNE initMessaging testen
		var scrolled = false;
		var animated = false;
		var interacted = false;
		var magic = false;
		function scrolling() { /* Noop – Ping-Pong übernimmt die Steuerung */ }

		// ------------------------------------------------------------
		// B) getUriParams (BLEIBT – index.js frame_0 nutzt getUriParams.clicktag)
		// ------------------------------------------------------------
		var getUriParams = function() {
			var query_string = {}
			var query = window.location.search.substring(1);
			var parmsArray = query.split('&');
			if(parmsArray.length <= 0) return query_string;
			for(var i = 0; i < parmsArray.length; i++) {
				var pair = parmsArray[i].split('=');
				var val = decodeURIComponent(pair[1]);
				if (val != '' && pair[0] != '') query_string[pair[0]] = val;
			}
			return query_string;
		}();

		// ------------------------------------------------------------
		// C) magicClicktag (BLEIBT – index.js frame_0 ruft magicClicktag())
		//    Sendet NUR mutForward ans game-Overlay. Laternen-Logik liegt dort.
		//    action:'fly' = Original-Wert der Designerin.
		// ------------------------------------------------------------
		function magicClicktag() {
			console.log("Magic Clicktag!");
			window.top.postMessage({
				name: 'mutForward',
				origin: 'sitebar',
				payload: {
					target: 'game',
					action: 'fly',
					direction: 'ltr'
				}
			}, '*');
		}

		// ------------------------------------------------------------
		// D) PING-PONG-SCROLL (initMessaging-kompatibel)
		//    - lauscht NUR auf mutScrollPosition, liest 'position' (nicht 'scrollY')
		//    - keine Prozent-/docHeight-Rechnung → kein NaN, kein Stauchen
		//    - Richtung aus Delta; Runter=vorwärts, Rauf=rückwärts
		//    - End-Stops bei Frame 0 / letztem Frame (kein Loop)
		//    - Pause 100ms nach Scroll-Stopp
		// ------------------------------------------------------------
		var FADE_IN_PX = 500;          // Einblendung ab 500px (wie Designerin); auf 400 ändern falls gewünscht
		var lastPos = null;
		var direction = 'idle';
		var tickerActive = false;
		var stopTimer = null;

		function applyScroll(pos) {
			if (pos == null || isNaN(pos)) return;

			// Einblendung der Sitebar
			var c = document.getElementById('animation_container');
			if (c) c.style.opacity = (pos >= FADE_IN_PX) ? '1' : '0';

			if (typeof exportRoot === 'undefined' || !exportRoot.timeline) { lastPos = pos; return; }
			if (lastPos === null) { lastPos = pos; return; }   // erster Snapshot = Baseline, nicht starten

			var d = pos - lastPos;
			if (Math.abs(d) < 1) { lastPos = pos; return; }    // Jitter ignorieren
			lastPos = pos;
			direction = d > 0 ? 'down' : 'up';
			startTick();

			clearTimeout(stopTimer);
			stopTimer = setTimeout(stopTick, 100);
		}

		function startTick() {
			if (tickerActive) return;
			tickerActive = true;
			exportRoot.stop();
			createjs.Ticker.addEventListener('tick', tick);
		}
		function tick() {
			if (!exportRoot || !exportRoot.timeline) return;
			var cur = exportRoot.currentFrame;
			var total = exportRoot.timeline.duration - 1;
			if (direction === 'down') {
				if (cur < total) exportRoot.gotoAndStop(cur + 1);
				else { exportRoot.gotoAndStop(total); stopTick(); }
			} else if (direction === 'up') {
				if (cur > 0) exportRoot.gotoAndStop(cur - 1);
				else { exportRoot.gotoAndStop(0); stopTick(); }
			} else { stopTick(); }
			if (stage) stage.update();
		}
		function stopTick() {
			tickerActive = false;
			createjs.Ticker.removeEventListener('tick', tick);
			direction = 'idle';
			if (exportRoot) exportRoot.stop();
		}

		// ------------------------------------------------------------
		// E) initMessaging-Handshake + Listener (Produktion)
		//    OHNE mutInit mit mutScrollPosition:true sendet die Library
		//    NIEMALS Scroll-Events an den Origin 'sitebar'.
		// ------------------------------------------------------------
		function sendPm() {
			window.top.postMessage({
				name: "mutInit",
				origin: "sitebar",
				payload: { mutScrollPosition: true, mutState: true }
			}, "*");
		}
		var fallbackTimer = setTimeout(sendPm, 1000);
		window.addEventListener("message", function(e) {
			var d = e.data;
			if (!d || !d.name) return;
			if (d.name === "mutInitReady") { clearTimeout(fallbackTimer); sendPm(); return; }
			if (d.name !== "mutScrollPosition") return;
			applyScroll(d.position);            // initMessaging sendet 'position'
		}, false);
		sendPm();

		// ------------------------------------------------------------
		// F) dummy-Modus: lokal OHNE initMessaging (Parent-Scroll direkt)
		//    Nutzt dieselbe applyScroll()-Logik → identisches Ping-Pong-Verhalten.
		// ------------------------------------------------------------
		if (dummy === true) {
			window.parent.addEventListener("scroll", function() {
				applyScroll(window.parent.scrollY || window.parent.pageYOffset);
			}, { passive: true });
		}
	</script>
</body>
</html>
